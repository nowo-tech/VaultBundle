nowo_vault:
    user_class: Nowo\VaultBundle\Tests\App\Entity\User
    encryption_key: '%env(VAULT_ENCRYPTION_KEY)%'
    browser_extension:
        enabled: true
        user_provider: security.user.provider.concrete.app_user_provider
        cors_allowed_origins: ['*']
        login_rate_limit:
            max_attempts: 3
            interval_seconds: 3600
    security:
        # The share tests use the free grantee type / id form (no GRANT_LIST_QUERY listener): the unsafe pre-1.15.2
        # behaviour. The fail-closed default is covered on the ConfigStorageKernel (VaultDenyStatusEndToEndTest).
        allow_unlisted_grantees: true
