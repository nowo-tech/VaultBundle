# CI: tests on PHP 8.2–8.5 × Symfony 7.0, 7.4, 8.1 (exclusions for incompatible pairs).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # feat/** : stacked feature branches (e.g. feat/1.16.0-scopes) get the same checks before they reach main.
    branches: [main, master, 'feat/**']

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): a PR that only touches composer.json /
  # composer.lock (root or demo), docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/** runs one
  # representative cell plus the cheap gates. Every other PR, and every push, runs everything. Fail-closed: any error
  # or an empty output means full (jobs skip only on mode == 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            mode=light
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then echo "full because of: $f"; mode=full; fi
            done <<< "$files"
          fi
          echo "mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required "PHP x - Symfony y"
    # contexts never appear. In light mode only the newest cell does the work; the others pass in seconds.
    if: ${{ !cancelled() }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, sodium
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          SYMFONY="${{ matrix.symfony }}"
          SYMFONY_MAJOR="${SYMFONY%%.*}"
          if [ "$SYMFONY_MAJOR" -ge 8 ]; then
            DOCTRINE_BUNDLE="^3.0"
          else
            DOCTRINE_BUNDLE="^2.10"
          fi
          echo "Using doctrine/doctrine-bundle ${DOCTRINE_BUNDLE} with Symfony ^${SYMFONY}"
          composer require \
            symfony/config:^${SYMFONY} \
            symfony/dependency-injection:^${SYMFONY} \
            symfony/form:^${SYMFONY} \
            symfony/framework-bundle:^${SYMFONY} \
            symfony/http-kernel:^${SYMFONY} \
            symfony/routing:^${SYMFONY} \
            symfony/security-bundle:^${SYMFONY} \
            symfony/translation:^${SYMFONY} \
            symfony/twig-bundle:^${SYMFONY} \
            symfony/validator:^${SYMFONY} \
            symfony/yaml:^${SYMFONY} \
            symfony/var-exporter:^${SYMFONY} \
            symfony/browser-kit:^${SYMFONY} \
            symfony/asset:^${SYMFONY} \
            symfony/dom-crawler:^${SYMFONY} \
            doctrine/doctrine-bundle:${DOCTRINE_BUNDLE} \
            --no-interaction --no-update
          composer update symfony/* doctrine/* --with-all-dependencies --no-interaction --prefer-dist --no-progress

      # 1.21: SearchKit (optional, PHP >= 8.3, never in composer.json / composer.lock) for the SearchKit group
      # vault_items. On PHP 8.2 the script does nothing: the group is not registered and its tests skip.
      - name: SearchKit (PHP 8.3 and later)
        if: env.HEAVY == 'true'
        run: .github/ci/search-kit.sh

      - name: Composer audit (Critical/High)
        if: env.HEAVY == 'true'
        run: composer audit --locked


      - name: Run tests
        if: env.HEAVY == 'true'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: env.HEAVY == 'true' && matrix.php == '8.2' && matrix.symfony == '7.4'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi
          echo "✅ Coverage generated"

  typescript:
    name: TypeScript tests + coverage gate
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name with success for branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest with coverage thresholds (vitest.config.ts; fails below the gate, REQ-TEST-003)
        run: pnpm run test:coverage

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 1.21: 8.4, so SearchKit is installed and the SearchKit group is analysed (the dependency-floor job runs
          # PHPStan without SearchKit: phpstan-search-kit.php leaves the group out there).
          php-version: '8.4'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          .github/ci/search-kit.sh

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

  database:
    # REQ-TEST-005 + REQ-RUNTIME-003: the id-mapping tests (LQ-V-M1) and the two-connection concurrency tests on real
    # servers, on DBAL 3 and DBAL 4. None may be skipped.
    name: Databases on ${{ matrix.database.name }} - DBAL ${{ matrix.dbal }}
    runs-on: ubuntu-latest
    needs: changes
    # Required matrix contexts: never skip the job. In light mode every cell passes after one echo step and the
    # service image is empty, so no database container is pulled.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        dbal: ['3', '4']
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            url: mysql://root@127.0.0.1:3306/vault_test?serverVersion=8.4.0&charset=utf8mb4
          - name: MariaDB 11.4
            image: mariadb:11.4
            url: mysql://root@127.0.0.1:3306/vault_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          - name: PostgreSQL 16
            image: postgres:16
            url: postgresql://postgres@127.0.0.1:5432/vault_test?serverVersion=16&charset=utf8
    services:
      database:
        image: ${{ needs.changes.outputs.mode != 'light' && matrix.database.image || '' }}
        # Throwaway CI databases without passwords (GitGuardian: no credential in the workflow).
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: vault_test
          MARIADB_DATABASE: vault_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vault_test
        ports:
          - 3306:3306
          - 5432:5432
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb
      VAULT_TEST_DATABASE_URL: ${{ matrix.database.url }}
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Light mode (deps/docs-only PR) - no database run
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_pgsql, sodium
          tools: composer:v2

      - name: Install dependencies (DBAL ${{ matrix.dbal }})
        if: env.HEAVY == 'true'
        run: |
          composer require doctrine/dbal:^${{ matrix.dbal }} --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-progress --no-interaction

      - name: Wait for the database
        if: env.HEAVY == 'true'
        run: |
          php -r 'require "vendor/autoload.php";
            $params = (new Doctrine\DBAL\Tools\DsnParser(["mysql" => "pdo_mysql", "postgresql" => "pdo_pgsql"]))->parse(getenv("VAULT_TEST_DATABASE_URL"));
            for ($i = 0; $i < 60; ++$i) {
                try { Doctrine\DBAL\DriverManager::getConnection($params)->executeQuery("SELECT 1"); exit(0); } catch (Throwable) { sleep(2); }
            }
            exit(1);'

      - name: Id mapping and concurrency tests (LQ-V-M1, REQ-RUNTIME-003)
        if: env.HEAVY == 'true'
        timeout-minutes: 15
        run: vendor/bin/phpunit --group database --no-coverage --fail-on-skipped

  # 1.21: the SearchKit group vault_items on real servers (the SearchKit contract kit: visibility, other users' rows,
  # trash, a host deny, LIKE escaping, the query budget; plus shares, scopes and exact ids). PHP 8.4 (SearchKit needs
  # PHP >= 8.3), DBAL 4. None may be skipped.
  searchkit-database:
    name: SearchKit on ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    # Light mode: skipped (not a required check, so the un-expanded skipped name is harmless).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            url: mysql://root@127.0.0.1:3306/vault_test?serverVersion=8.4.0&charset=utf8mb4
          - name: MariaDB 11.4
            image: mariadb:11.4
            url: mysql://root@127.0.0.1:3306/vault_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          - name: PostgreSQL 16
            image: postgres:16
            url: postgresql://postgres@127.0.0.1:5432/vault_test?serverVersion=16&charset=utf8
    services:
      database:
        image: ${{ matrix.database.image }}
        # Throwaway CI databases without passwords (GitGuardian: no credential in the workflow).
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: vault_test
          MARIADB_DATABASE: vault_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vault_test
        ports:
          - 3306:3306
          - 5432:5432
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb
      VAULT_TEST_DATABASE_URL: ${{ matrix.database.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, sodium
          tools: composer:v2

      - name: Install dependencies and SearchKit
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          .github/ci/search-kit.sh

      - name: Wait for the database
        run: |
          php -r 'require "vendor/autoload.php";
            $params = (new Doctrine\DBAL\Tools\DsnParser(["mysql" => "pdo_mysql", "postgresql" => "pdo_pgsql"]))->parse(getenv("VAULT_TEST_DATABASE_URL"));
            for ($i = 0; $i < 60; ++$i) {
                try { Doctrine\DBAL\DriverManager::getConnection($params)->executeQuery("SELECT 1"); exit(0); } catch (Throwable) { sleep(2); }
            }
            exit(1);'

      - name: SearchKit group tests on the server
        timeout-minutes: 15
        run: vendor/bin/phpunit --group searchkit --no-coverage --fail-on-skipped

  # The bundle must work with the lowest nowo-tech/transaction-* versions its composer.json allows (hosts and demos
  # can run `composer update nowo-tech/vault-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and the demo
  # fails with "class not found").
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config platform.php 8.4.1
          composer update --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan --no-interaction

      - name: Unit and integration suites at the floor
        timeout-minutes: 15
        run: vendor/bin/phpunit --no-coverage --testsuite unit,integration

  igor:
    name: Igor (FrankenPHP worker state)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name with success for branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name with success for branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 1.21: 8.4, so SearchKit is installed and the SearchKit group counts towards the 100% gate.
          php-version: '8.4'
          extensions: json, sodium
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.x)
        run: |
          composer require symfony/config:^7.0 symfony/dependency-injection:^7.0 symfony/form:^7.0 symfony/framework-bundle:^7.0 symfony/http-foundation:^7.0 symfony/http-kernel:^7.0 symfony/routing:^7.0 symfony/twig-bundle:^7.0 symfony/web-profiler-bundle:^7.0 symfony/var-exporter:^7.0 symfony/browser-kit:^7.0 symfony/asset:^7.0 symfony/dom-crawler:^7.0 doctrine/doctrine-bundle:^2.10 --no-interaction --no-update
          composer update symfony/* doctrine/* --with-all-dependencies --no-interaction --prefer-dist --no-progress
          .github/ci/search-kit.sh

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          rm -rf .phpunit.cache
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "✅ coverage.xml generated"

      - name: Enforce 100% PHP line coverage of src/ (REQ-TEST-003)
        run: php scripts/check-coverage.php coverage.xml --min-percent=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
