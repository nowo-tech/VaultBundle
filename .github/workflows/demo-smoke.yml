# REQ-TEST-011 — Demo smoke: boot the FrankenPHP demo and assert one HTTP 200 (redirects followed), then stop it.
# Not a required check: weekly, on tags, on demand, and on pull requests that touch the demo or its Makefiles.
name: Demo smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'demo/**'
      - 'Makefile'
      - '.github/workflows/demo-smoke.yml'

permissions:
  contents: read

jobs:
  demo-smoke:
    name: Demo symfony8 smoke (HTTP 200)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Compose
        run: docker compose version

      - name: Run demo smoke (REQ-TEST-011)
        run: make demo-smoke
