# Bundle service definitions.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        # 1.19.0 (REQ-ARCH-001 rule 3): the vault services ask the host ports through internal gates, which ask the
        # framework-free 1.19 interfaces, the deprecated ones (exactly as in 1.18) or both (VaultPortsPass).
        bind:
            Nowo\VaultBundle\Security\VaultAccessCheckerInterface: '@nowo_vault.port.access_checker'
            Nowo\VaultBundle\Security\VaultTeamMembershipResolverInterface: '@nowo_vault.port.team_membership'
            Nowo\VaultBundle\Support\VaultUserLocatorInterface: '@nowo_vault.port.user_locator'
            Nowo\VaultBundle\Service\VaultHealthReporterInterface: '@nowo_vault.port.health_reporter'

    Nowo\VaultBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Config/'
            - '../../VaultBundle.php'
            - '../../Repository/'
            - '../../Doctrine/'
            - '../../Security/'
            - '../../BrowserExtension/VaultBrowserExtensionLoginRateLimiter.php'
            - '../../Controller/'
            - '../../Internal/'
            - '../../Port/'

    # REQ-SF-004 rule 7: controllers are registered explicitly, NOT autoconfigured (no #[AsController]). On
    # Symfony >= 7.3 a #[Route] class is autoconfigured with the routing.controller tag and the host's
    # `routing.controllers` resource would expose /tools/vault/... and /api/vault/extension/... without the
    # nowo_vault route loader (bypassing the configured routes, web_ui.enabled and browser_extension.enabled).
    Nowo\VaultBundle\Controller\:
        resource: '../../Controller/'
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\VaultBundle\Routing\VaultRouteLoader:
        arguments:
            $runtimeConfig: '@Nowo\VaultBundle\Config\VaultRuntimeConfigProvider'
            $configStorageEnabled: '%nowo_vault.config_storage.enabled%'
            $webUiEnabled: '%nowo_vault.web_ui.enabled%'
            $browserExtensionEnabled: '%nowo_vault.browser_extension.enabled%'
            $browserExtensionRoutes: '%nowo_vault.browser_extension.routes%'
            $enabledOptionalRouteKeys: '%nowo_vault.enabled_optional_route_keys%'
            $sharingEnabled: '%nowo_vault.sharing.enabled%'
        tags:
            - { name: routing.loader }

    Nowo\VaultBundle\Controller\VaultBrowserExtensionController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments']

    Nowo\VaultBundle\Service\VaultBrowserExtensionAuthService:
        arguments:
            $tokenTtlSeconds: '%nowo_vault.browser_extension.token_ttl%'
            $accessChecker: '@nowo_vault.port.access_checker'
            $userChecker: null

    Nowo\VaultBundle\Command\ReencryptVaultPayloadsCommand:
        arguments:
            $databaseEnabled: '%nowo_vault.config_storage.enabled%'

    Nowo\VaultBundle\Controller\VaultManageController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $runtimeConfig: '@Nowo\VaultBundle\Config\VaultRuntimeConfigProvider'
            $passwordStrengthEnabled: '%nowo_vault.password_strength_enabled%'
            $tagInputEnabled: '%nowo_vault.tag_input_enabled%'
            $configStorage: '%nowo_vault.config_storage%'
            $allowUnauthenticated: '%nowo_vault.security.allow_unauthenticated%'
            $perPage: '%nowo_vault.pagination.per_page%'
            $denyStatus: '%nowo_vault.security.deny_status%'
            $temporaryGrantsUi: '%nowo_vault.grants.temporary.ui%'
            $profiler: '@?profiler'
            $revealAutoHideSeconds: '%nowo_vault.reveal.auto_hide_seconds%'
            $sharingEnabled: '%nowo_vault.sharing.enabled%'

    # 1.16.0 scope vaults (routes registered only with nowo_vault.scopes.enabled).
    Nowo\VaultBundle\Controller\VaultScopeController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $runtimeConfig: '@Nowo\VaultBundle\Config\VaultRuntimeConfigProvider'
            $passwordStrengthEnabled: '%nowo_vault.password_strength_enabled%'
            $tagInputEnabled: '%nowo_vault.tag_input_enabled%'
            $perPage: '%nowo_vault.pagination.per_page%'
            $denyStatus: '%nowo_vault.security.deny_status%'
            $cataloguePerPage: '%nowo_vault.catalogue.per_page%'

    Nowo\VaultBundle\Controller\VaultRevealController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $allowUnauthenticated: '%nowo_vault.security.allow_unauthenticated%'
            $denyStatus: '%nowo_vault.security.deny_status%'
            $profiler: '@?profiler'

    # 1.16.0 decrypted personal export (routes registered only with nowo_vault.export.enabled; limits set by the extension).
    Nowo\VaultBundle\Controller\VaultExportController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $profiler: '@?profiler'

    Nowo\VaultBundle\Service\VaultPersonalExportStreamer:
        arguments:
            $managerName: '%nowo_vault.entity_manager%'

    Nowo\VaultBundle\Service\VaultPersonalDataExporter:
        arguments:
            $managerName: '%nowo_vault.entity_manager%'

    Nowo\VaultBundle\Service\VaultPersonalDataEraser:
        arguments:
            $managerName: '%nowo_vault.entity_manager%'

    Nowo\VaultBundle\Service\VaultFieldRevealer:
        arguments:
            $revealableFields: '%nowo_vault.reveal.revealable_fields%'

    Nowo\VaultBundle\Service\VaultCatalogue:
        arguments:
            $managerName: '%nowo_vault.entity_manager%'

    Nowo\VaultBundle\Service\VaultGrantService:
        arguments:
            $temporary: '%nowo_vault.grants.temporary%'

    Nowo\VaultBundle\Support\VaultUserLocator:
        arguments:
            $userClass: '%nowo_vault.user_class%'
            $managerName: '%nowo_vault.entity_manager%'

    # 1.17.0: port for loading a host user by id; alias it to your own service when users are no Doctrine entities.
    Nowo\VaultBundle\Support\VaultUserLocatorInterface: '@Nowo\VaultBundle\Support\VaultUserLocator'

    Nowo\VaultBundle\Command\CheckDowngradeCommand:
        arguments:
            $managerName: '%nowo_vault.entity_manager%'

    Nowo\VaultBundle\Service\VaultGrantListResolver:
        arguments:
            $allowUnlistedGrantees: '%nowo_vault.security.allow_unlisted_grantees%'

    Nowo\VaultBundle\Service\VaultBrowserExtensionLoginResolver:
        arguments:
            $maxLoginItems: '%nowo_vault.browser_extension.max_login_items%'

    Nowo\VaultBundle\Controller\VaultRuntimeConfigController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $databaseEnabled: '%nowo_vault.config_storage.enabled%'
            $allowUnauthenticated: '%nowo_vault.security.allow_unauthenticated%'

    # UiKit page contract (REQ-UI-003): layout of the manage pages (null = nowo_ui_kit.layouts.admin).
    Nowo\VaultBundle\Ui\VaultPages:
        arguments:
            $layoutTemplate: '%nowo_vault.web_ui.layout_template%'
            $twig: '@twig'
            $sharingEnabled: '%nowo_vault.sharing.enabled%'
            $hostNoteTemplate: '%nowo_vault.web_ui.host_note_template%'
            $destructiveActionsInMenu: '%nowo_vault.web_ui.destructive_actions_in_menu%'

    # Deprecated since 1.15: the nowo_vault_css_framework Twig global (the pages read nowo_ui_kit).
    Nowo\VaultBundle\Twig\VaultExtension:
        arguments:
            $cssFramework: '%nowo_vault.css_framework%'

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\VaultBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']
