name: vault-bundle

services:
  php:
    build: .
    volumes:
      - .:/app
      - coverage-data:/app/coverage
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
      # MongoDB is require-dev only; CI and local dev may resolve deps without ext-mongodb loaded.
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

  # REQ-TEST-005: database for `make test-with-db` only (profile "db"; `make up` does not start it). Throwaway test
  # database without a password, reachable only on the compose network (no host port), same image as the CI job.
  mysql:
    image: mysql:8.4
    profiles: ["db"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: vault_test
    tmpfs:
      - /var/lib/mysql

  # REQ-RUNTIME-003: the concurrency tests run on MySQL, MariaDB and PostgreSQL (`make test-with-db DB=mariadb|postgres`).
  mariadb:
    image: mariadb:11.4
    profiles: ["db"]
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: vault_test
    tmpfs:
      - /var/lib/mysql

  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: vault_test
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  coverage-data:
